*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hero1)}
button{font-family:inherit}
a{color:var(--blue)}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(110px + env(safe-area-inset-bottom,0px))}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--hero1);color:var(--hero-ink)}
.topin{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px}
.brand{font:italic 900 22px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.brand i{display:inline-block;width:18px;height:6px;background:var(--accent);transform:skewX(-20deg);border-radius:1px}
.brand small{display:block;font:500 11px var(--body);letter-spacing:0;text-transform:none;color:var(--hero-muted);font-style:normal;margin-top:3px}
.who{margin-left:auto;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:60%}
.who::-webkit-scrollbar{display:none}
.av{flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:800 13px var(--display);color:#fff;border:2px solid transparent;cursor:pointer;padding:0}
.av[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
.av.sm{width:24px;height:24px;font-size:10px;border-width:0;cursor:default}

/* typography */
h2{font:italic 800 20px/1.15 var(--display);text-transform:uppercase;letter-spacing:.01em;margin:22px 0 10px;text-wrap:balance}
h3{font:700 17px/1.25 var(--body);margin:0;text-wrap:balance}
.eyebrow{font:700 11px var(--body);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font:italic 800 28px/1 var(--display)}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);display:grid;gap:12px;min-width:0}
.stack{display:grid;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hero{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:var(--hero-ink);border-radius:22px;padding:18px;position:relative;overflow:hidden;display:grid;gap:14px}
.hero::after{content:"";position:absolute;right:-40px;top:-30px;width:180px;height:220px;background:repeating-linear-gradient(-60deg,rgba(255,255,255,.06) 0 10px,transparent 10px 22px);pointer-events:none}
.hero .muted{color:var(--hero-muted)}
.hero .eyebrow{color:var(--hero-muted)}

/* controls */
.btn{font:700 14px var(--body);border-radius:12px;padding:10px 14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.ghost{background:transparent}
.btn.wide{width:100%}
.btn.big{padding:14px 18px;font:italic 800 16px var(--display);text-transform:uppercase;letter-spacing:.02em}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
:is(.btn,.av,.chipbtn,.tab,.seg button,.check,input,select,textarea,.glass,summary):focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:700 13px var(--body);padding:8px 6px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--surface2);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.chip b{font-weight:700}
.chip.p b{color:var(--p)} .chip.f b{color:var(--f)} .chip.c b{color:var(--c)}
.chipbtn{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:7px 10px;font:600 13px var(--body);cursor:pointer;flex:0 0 auto;text-align:center}
.chipbtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chipbtn small{display:block;font-weight:400;font-size:10px;opacity:.75}
.scroller{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.scroller::-webkit-scrollbar{display:none}
input,select,textarea{font:16px var(--body);padding:10px 11px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);width:100%;min-width:0}
textarea{min-height:90px;resize:vertical}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .full{grid-column:1/-1}
.check{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check:last-child{border-bottom:0}
.box{flex:0 0 24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;transition:background .15s}
.box svg{width:14px;height:14px;stroke:var(--accent-ink);stroke-width:3;fill:none;opacity:0}
.on .box{background:var(--accent);border-color:var(--accent)}
.on .box svg{opacity:1}
.bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.hero .bar{background:var(--hero-track)}
.bar i{display:block;height:100%;border-radius:4px;background:var(--accent);transition:width .4s}
.pill{font:700 11px var(--body);text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:6px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}

/* meals */
.meal{display:grid;gap:10px}
.mtitle{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.plates{display:flex;gap:8px;flex-wrap:wrap}
.plate{display:flex;align-items:center;gap:6px;background:var(--surface2);border-radius:999px;padding:3px 10px 3px 3px;font-size:13px}
.tbl{overflow-x:auto;margin:0 -2px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font:700 11px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:right;padding:4px 6px;white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:0}
td{padding:6px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
td:first-child{white-space:normal}
td.tot{font-weight:700}
details summary{cursor:pointer;font:600 13px var(--body);color:var(--blue);list-style:none}
details summary::-webkit-details-marker{display:none}


/* закреплённый итог дня */
.daybar{background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(13,23,38,.08)}
.db{display:flex;align-items:center;gap:12px;width:100%;max-width:680px;margin:0 auto;border:0;background:transparent;color:var(--ink);cursor:pointer;text-align:left;padding-block:7px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-family:var(--body)}
.db:focus-visible{outline:2.5px solid var(--accent);outline-offset:-3px}
.db-score{flex:0 0 auto;width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:italic 900 15px var(--display);transform:skewX(-6deg)}
.db-k{flex:1.4;min-width:0;display:grid;gap:2px}
.db-s{flex:1;min-width:0;display:grid;gap:2px}
.db-l{font:600 9.5px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.db b{font:italic 800 15px/1.1 var(--display);white-space:nowrap}
.db b small{font:500 11px var(--body);color:var(--muted)}
.db-bar{height:4px;border-radius:2px;background:var(--surface2);overflow:hidden}
.db-bar i{display:block;height:100%;border-radius:2px}
@media (max-width:375px){.db{gap:8px}.db-s:last-child{display:none}.db b{font-size:14px}.db-score{width:32px;height:32px;font-size:13px}}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabsin{max-width:680px;margin:0 auto;display:flex}
.tab{flex:1;background:none;border:0;color:var(--muted);font:600 11px var(--body);padding:9px 2px 10px;cursor:pointer;display:grid;justify-items:center;gap:3px;position:relative}
.tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--accent)}
.tab[aria-selected="true"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tab .dot{position:absolute;top:6px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--accent)}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(5,10,20,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:92vh;max-height:92dvh;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border-radius:22px 22px 0 0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px;align-content:start}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto}
.sheet h3{font:italic 800 19px var(--display);text-transform:uppercase}

/* recipe steps */
ol.steps{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ol.steps button{width:100%;text-align:left;display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);font:15px/1.45 var(--body);cursor:pointer}
.sn{flex:0 0 28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font:italic 800 14px/28px var(--display);text-align:center}
ol.steps button.done{opacity:.55}
ol.steps button.done span:last-child{text-decoration:line-through}
ol.steps button.done .sn{background:var(--accent);color:var(--accent-ink)}
.tip{background:var(--blue-soft);border-radius:12px;padding:10px 12px;font-size:14px}

/* today */
.ringwrap{display:flex;gap:16px;align-items:center}
.ringwrap svg{flex:0 0 auto;width:min(128px,33vw);height:auto}
.stats{display:grid;gap:8px;flex:1;min-width:0}
.stat{display:flex;justify-content:space-between;gap:8px;font-size:14px;border-bottom:1px solid var(--hero-track);padding-bottom:6px}
.stat:last-child{border:0;padding:0}
.stat b{font:italic 800 17px var(--display)}
.glasses{display:flex;gap:6px;flex-wrap:wrap}
.glass{width:34px;height:42px;border:2px solid var(--blue);border-radius:4px 4px 10px 10px;background:transparent;cursor:pointer;position:relative;overflow:hidden;padding:0}
.glass.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:75%;background:var(--blue);opacity:.75}
.score{width:58px;height:58px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:italic 900 24px var(--display);transform:skewX(-6deg)}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px}
.daynav strong{font:italic 800 16px var(--display);text-transform:uppercase}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-size:18px;display:grid;place-items:center}
.banner{display:flex;gap:12px;align-items:center;background:var(--accent-soft);border-radius:16px;padding:12px 14px}
.banner .num{font-size:22px;color:var(--accent)}

/* pantry */
.pl{display:grid;grid-template-columns:auto 1fr 96px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.pl:last-child{border-bottom:0}
.pl .nm{min-width:0}
.pl .nm small{display:block;color:var(--muted);font-size:12px}
.pl input{padding:7px 8px;text-align:right}
.weekgrid{display:grid;grid-template-columns:34px repeat(4,1fr);gap:3px;font-size:11px}
.weekgrid div{background:var(--surface2);border-radius:6px;padding:4px 5px;line-height:1.2;min-height:34px;overflow:hidden}
.weekgrid .hd{background:transparent;font-weight:700;color:var(--muted);min-height:0;text-transform:uppercase;font-size:10px}
.weekgrid .own{background:color-mix(in srgb,var(--good) 20%,transparent)}
.weekgrid .buy{background:var(--accent-soft)}
.weekgrid .none{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--lg)}

/* sport */
.ex{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.ex:last-child{border:0}
.exn{width:38px;height:38px;border-radius:10px;background:var(--hero1);color:#fff;display:grid;place-items:center;font:italic 800 16px var(--display)}
.player{position:fixed;inset:0;z-index:30;background:linear-gradient(160deg,var(--hero1),var(--hero2));color:var(--hero-ink);display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));gap:14px;overflow:auto}
.player .pbig{font:italic 900 clamp(56px,20vw,88px)/1 var(--display);text-align:center}
.player h3{font:italic 800 26px/1.15 var(--display);text-transform:uppercase;text-align:center}
.player .muted{color:var(--hero-muted)}
.player .btn{border-color:var(--hero-track);background:transparent;color:#fff}
.player .btn.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.medals{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.medal{display:grid;justify-items:center;gap:6px;text-align:center;font-size:12px;padding:10px 4px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.medal b{font-size:12.5px;line-height:1.2}
.medal.lock{opacity:.45;filter:grayscale(1)}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mgrid div{aspect-ratio:1;border-radius:6px;background:var(--surface2);display:grid;place-items:center;font-size:10px;color:var(--muted);max-width:100%}
.mgrid .ok{background:var(--good);color:#fff}
.mgrid .part{background:color-mix(in srgb,var(--good) 35%,transparent);color:var(--ink)}
.mgrid .fut{background:transparent;border:1px dashed var(--line)}
.mgrid .td{outline:2px solid var(--accent)}

/* splash */
#splash{position:fixed;inset:0;z-index:50;background:radial-gradient(120% 80% at 80% 0%,var(--hero2),var(--hero1) 60%);color:#fff;display:grid;place-items:center;text-align:center;transition:opacity .45s,visibility .45s}
#splash.out{opacity:0;visibility:hidden}
.sp-logo{font:italic 900 clamp(56px,16vw,96px)/.9 var(--display);text-transform:uppercase;letter-spacing:.01em}
.sp-logo span{color:var(--accent)}
.sp-stripes{display:flex;gap:7px;justify-content:center;margin:18px 0 14px}
.sp-stripes i{width:46px;height:9px;background:var(--accent);transform:skewX(-25deg);border-radius:2px}
.sp-stripes i:nth-child(2){opacity:.7}.sp-stripes i:nth-child(3){opacity:.4}
.sp-sub{color:var(--hero-muted);font-size:14px;letter-spacing:.04em}
.sp-load{width:180px;height:4px;border-radius:2px;background:rgba(255,255,255,.15);margin:26px auto 0;overflow:hidden}
.sp-load i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left}
@media (prefers-reduced-motion:no-preference){
  .sp-logo{animation:spIn .7s cubic-bezier(.2,.9,.2,1) both}
  .sp-stripes i{animation:spStripe .6s cubic-bezier(.2,.9,.2,1) both}
  .sp-stripes i:nth-child(2){animation-delay:.08s}.sp-stripes i:nth-child(3){animation-delay:.16s}
  .sp-load i{animation:spLoad 1.3s ease-in-out both}
  .view{animation:vIn .25s ease-out}
}
@keyframes spIn{from{transform:translateX(-30px) skewX(-8deg);opacity:0}to{transform:none;opacity:1}}
@keyframes spStripe{from{transform:translateX(60px) skewX(-25deg);opacity:0}}
@keyframes spLoad{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes vIn{from{opacity:.4;transform:translateY(6px)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:60;max-width:calc(100% - 32px);text-align:center}
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:18px;text-align:center;color:var(--muted)}
@media (max-width:420px){.pl{grid-template-columns:auto 1fr 84px}.num{font-size:24px}}
/* маленькие телефоны: iPhone SE / mini, узкие Android (320–375 px) */
@media (max-width:375px){
  body{font-size:14px}
  .brand{font-size:19px}.brand small{font-size:10px}
  .av{width:30px;height:30px;font-size:12px}
  .card{padding:14px;border-radius:16px}.hero{padding:15px;border-radius:18px}
  h2{font-size:18px;margin-top:16px}
  .ringwrap{gap:12px}.stat{font-size:13px}.stat b{font-size:15px}
  .score{width:50px;height:50px;font-size:20px}
  .btn{padding:9px 12px}.btn.big{font-size:15px;padding:13px 14px}
  .seg button{font-size:12px;padding:8px 4px}
  .tab{font-size:10px}.tab svg{width:21px;height:21px}
  .weekgrid{grid-template-columns:26px repeat(4,1fr);font-size:10px}
  .glass{width:30px;height:38px}
  .medals{grid-template-columns:repeat(auto-fill,minmax(88px,1fr))}
  .pl{grid-template-columns:auto 1fr 76px;gap:8px}
}
.card,.hero,.sheet,.stack{grid-template-columns:minmax(0,1fr)}.hero>*,.card>*,.stack>*{min-width:0}.grid2>*{min-width:0}.hero .grid2 .between{flex-wrap:wrap;gap:0 6px}
@media (max-width:375px){.hero .grid2 .between{flex-direction:column;align-items:flex-start}}
@media (max-width:340px){.ringwrap svg{width:96px}.stat{font-size:12px}.stat b{font-size:14px}.weekgrid{font-size:9px}}
/* большие экраны и планшеты */
@media (min-width:700px){.wrap{padding-block:8px calc(110px + env(safe-area-inset-bottom,0px))}.medals{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}}
/* горизонтальная ориентация телефона */
@media (orientation:landscape) and (max-height:500px){.player{gap:8px}.player .pbig{font-size:52px}.player h3{font-size:20px}.sheet{max-height:96dvh}#splash .sp-logo{font-size:56px}}
@media (hover:hover){.btn:hover,.chipbtn:hover{filter:brightness(.97)}}
.btn,.chipbtn,.tab,.glass,.check,.iconbtn,.av{touch-action:manipulation}
</style>

</head>
<body>
<div id="splash" role="presentation">
  <div>
    <div class="sp-logo">Ми<span>нус</span></div>
    <div class="sp-stripes"><i></i><i></i><i></i></div>
    <div class="sp-sub">Семейное меню · Тренировки · Марафоны</div>
    <div class="sp-load"><i></i></div>
  </div>
</div>

<header class="topbar">
  <div class="topin">
    <div class="brand"><i></i><div>Минус<small id="brandSub">Меню на минус</small></div></div>
    <div class="who" id="who" role="group" aria-label="Участник"></div>
  </div>
  <div id="daybar" class="daybar"></div>
</header>

function target(m){
  const bmr=10*m.weight+6.25*m.height-5*m.age+(m.sex==="m"?5:-161);
  const tdee=bmr*m.act,lose=m.goal==="lose";
  let kcal=Math.round(tdee*(1-(lose?m.def:0))/10)*10;
  const fl=m.sex==="m"?1500:1200;if(lose&&kcal<fl)kcal=fl;
  const[pp,ff,cc]=lose?[.3,.3,.4]:[.2,.3,.5];
  return{bmr:r(bmr),tdee:r(tdee),kcal,p:r(kcal*pp/4),f:r(kcal*ff/9),c:r(kcal*cc/4)};
}

const allKeys=()=>[...Object.keys(PR),...Object.keys(S.custom)];
const P=k=>PR[k]||S.custom[k]||["Удалённый продукт",0,0,0,0,"Прочее",0];
function mac(items){let k=0,p=0,f=0,c=0;for(const[key,g]of items){const x=P(key);k+=x[1]*g/100;p+=x[2]*g/100;f+=x[3]*g/100;c+=x[4]*g/100}return{k,p,f,c}}
const dish=(s,i)=>POOL[s][i];
const scale=(items,f)=>items.map(([k,g])=>[k,P(k)[8]?g:Math.max(5,Math.round(g*f/5)*5)]);
function baseK(m,row){let t=0;for(const[s]of SLOTS)if(m.eats[s]&&row[s]!=null)t+=mac(dish(s,row[s]).i).k;return t}
function factor(m,row){const b=baseK(m,row);return b?Math.min(2,Math.max(.6,target(m).kcal/b)):1}
function portion(m,row,s){if(!m.eats[s]||row[s]==null)return null;return scale(dish(s,row[s]).i,factor(m,row))}
function slotNeed(row,s,mult=1){const o={};for(const m of S.members){const p=portion(m,row,s);if(p)for(const[k,g]of p)o[k]=(o[k]||0)+g*mult}return o}
function weekNeed(plan){const o={};plan.forEach(row=>SLOTS.forEach(([s])=>{const n=slotNeed(row,s);for(const k in n)o[k]=(o[k]||0)+n[k]}));return o}
const gStr=(k,g)=>{const pc=P(k)[8];if(pc)return(Math.round(g/pc*2)/2).toLocaleString("ru-RU")+" шт";return k==="oil"?r(g)+" мл":fmt(g)+" г"};

// ===== Кладовая
function pantryAmounts(){const o={};for(const k in S.pantry){const x=S.pantry[k];if(x.on&&x.g>0)o[k]=x.g}return o}
function mates(k){const g=P(k)[7];return g?allKeys().filter(x=>x!==k&&P(x)[7]===g):[]}
function avail(k,pan){let a=pan[k]||0;for(const x of mates(k))a+=pan[x]||0;return a}
function take(need,pan){const miss={};for(const k in need){let g=need[k];for(const x of[k,...mates(k)]){if(g<=0)break;const t=Math.min(pan[x]||0,g);if(t>0){pan[x]-=t;g-=t}}if(g>.5)miss[k]=(miss[k]||0)+g}return{miss}}
function fits(need,pan){for(const k in need){if(STAPLE.has(k))continue;if(avail(k,pan)+.5<need[k])return false}return true}

const price=(k,st=S.store)=>(S.prices[k]??P(k)[6]??0)*storeMul(st);
function buyQty(k,g){const pc=P(k)[8];if(pc)return{q:Math.ceil(g/pc-.05),u:"шт"};if(k==="oil")return{q:Math.ceil(g/50)*50,u:"мл"};return{q:Math.ceil(g/100)*100,u:"г"}}
function cost(k,g,st){const b=buyQty(k,g);return P(k)[8]?b.q*price(k,st):b.q/1000*price(k,st)}
const rawCost=(k,g)=>{const pc=P(k)[8];return pc?g/pc*price(k):g/1000*price(k)};
const qtyStr=(k,g)=>{const b=buyQty(k,g);return b.u==="г"&&b.q>=1000?(b.q/1000).toLocaleString("ru-RU")+" кг":b.q+" "+b.u};
const sumCost=(o,st)=>Object.entries(o).reduce((a,[k,g])=>a+cost(k,g,st),0);

// ===== Журнал дня
const EMPTY=()=>({steps:0,meals:{},water:0,extra:0,wo:[]});
function L(date=UI.date,mid=S.active){S.log[date]??={};S.log[date][mid]??=EMPTY();return S.log[date][mid]}
const Lr=(date,mid)=>S.log[date]?.[mid]||EMPTY();
function dayRes(date,m){
  const l=Lr(date,m.id),t=target(m),row=S.plan[wd(date)];
  let eaten=l.extra||0,p=0,f=0,c=0,planned=0,done=0;
  for(const[s]of SLOTS){const pr=portion(m,row,s);if(!pr)continue;planned++;if(l.meals[s]){done++;const x=mac(pr);eaten+=x.k;p+=x.p;f+=x.f;c+=x.c}}
  const stepsK=Math.max(0,(l.steps||0)-4000)*m.weight*.0004;
  const woK=(l.wo||[]).reduce((a,w)=>a+w.kcal,0);
  const burn=t.tdee+stepsK+woK,sg=m.stepsGoal||8000;
  let score=(planned?done/planned:0)*40+Math.min(1,(l.steps||0)/sg)*30+Math.min(1,(l.water||0)/8)*15+((l.wo||[]).length?15:(l.steps>=sg?10:0));
  if((l.extra||0)>250)score-=10;
  return{l,t,eaten,p,f,c,planned,done,stepsK,woK,burn,bal:eaten-burn,score:Math.max(0,r(score)),sg};
}

// ===== Взвешивания
const lastW=mid=>{const a=S.weigh[mid]||[];return a[a.length-1]};
const dueIn=mid=>{const l=lastW(mid);return l?7-diffD(l.d,TODAY):0};
const dueMembers=()=>S.members.filter(m=>dueIn(m.id)<=0);

// ===== Марафоны
function mDayOk(mr,mid,date){
  const m=M(mid);if(!m)return false;const l=Lr(date,mid);
  switch(mr.kind){
    case"steps":return(l.steps||0)>=mr.target;
    case"water":return(l.water||0)>=mr.target;
    case"menu":{let n=0,d=0;for(const[s]of SLOTS){if(!m.eats[s])continue;n++;if(l.meals[s])d++}return n>0&&d===n}
    case"workout":return(l.wo||[]).length>0;
    default:return!!mr.manual?.[date]?.[mid];
  }
}
function mProg(mr,mid){
  const end=Math.min(diffD(mr.start,TODAY),mr.days-1);let ok=0,n=0;
  for(let i=0;i<=end;i++){const d=addD(mr.start,i);if(mDayOk(mr,mid,d))ok++;n+=(Lr(d,mid).wo||[]).length}
  if(mr.kind==="workout")return{ok:n,goal:mr.target,pct:Math.min(1,n/mr.target)};
  return{ok,goal:mr.days,pct:ok/mr.days};
}
const mDone=mr=>diffD(mr.start,TODAY)>=mr.days;
const mStatus=mr=>{const n=diffD(mr.start,TODAY);return n<0?`Старт ${dShort(mr.start)}`:mDone(mr)?"Завершён":`День ${n+1} из ${mr.days}`};

// ===== Награды
function awards(m){
  const w=S.weigh[m.id]||[],lost=w.length?w[0].w-w[w.length-1].w:0;
  let maxSteps=0,wo=0,perfect=0,st=0,best=0,prev=null,water=0,ms=0,mbest=0,mprev=null;
  for(const d of Object.keys(S.log).sort()){
    const l=S.log[d][m.id];if(!l)continue;
    maxSteps=Math.max(maxSteps,l.steps||0);wo+=(l.wo||[]).length;if((l.water||0)>=8)water++;
    const res=dayRes(d,m);if(res.score>=90)perfect++;
    if((l.steps||0)>=res.sg){st=prev&&diffD(prev,d)===1?st+1:1;prev=d;best=Math.max(best,st)}
    if(res.planned&&res.done===res.planned){ms=mprev&&diffD(mprev,d)===1?ms+1:1;mprev=d;mbest=Math.max(mbest,ms)}
  }
  const fin=S.marathons.filter(mr=>mDone(mr)&&mr.members.includes(m.id)&&mProg(mr,m.id).pct>=.8).length;
  return[
    ["Старт","Первое взвешивание","GO",w.length>0],
    ["Минус 1 кг","Первый килограмм","−1",lost>=1],
    ["Минус 3 кг","Три килограмма","−3",lost>=3],
    ["Минус 5 кг","Пять килограммов","−5",lost>=5],
    ["Минус 10 кг","Десять килограммов","−10",lost>=10],
    ["10K","10 000 шагов за день","10K",maxSteps>=10000],
    ["Серия шагов","Цель по шагам 7 дней подряд","7×",best>=7],
    ["Первая тренировка","Завершить тренировку","1",wo>=1],
    ["10 тренировок","Десять тренировок","10",wo>=10],
    ["Идеальный день","Итог дня 90 и выше","90+",perfect>=1],
    ["Неделя по меню","7 дней подряд всё по плану","7д",mbest>=7],
    ["Водный баланс","8 стаканов 5 дней","H₂O",water>=5],
    ["Финишер","Марафон пройден на 80%+","FIN",fin>=1],
    ["Дисциплина","4 еженедельных взвешивания","4×",w.length>=4]
  ];
}

}

function ring(v,max,size,sw,col,inner=""){const R=(size-sw)/2,C=2*Math.PI*R,p=Math.max(0,Math.min(1,max?v/max:0)),h=size/2;
  return`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${h}" cy="${h}" r="${R}" style="fill:none;stroke:var(--hero-track)" stroke-width="${sw}"/><circle cx="${h}" cy="${h}" r="${R}" style="fill:none;stroke:${col}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${(C*p).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 ${h} ${h})"/>${inner}</svg>`}
const bar=(v,max,col="var(--accent)")=>`<div class="bar"><i style="width:${Math.min(100,max?v/max*100:0)}%;background:${col}"></i></div>`;
const seg=(act,items,cur)=>`<div class="seg">${items.map(([v,l])=>`<button data-act="${act}" data-v="${v}" aria-pressed="${v===cur}">${l}</button>`).join("")}</div>`;
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2300)}
function openSheet(html,label){closeSheet();const bg=document.createElement("div");bg.className="sheet-bg";bg.id="sheet";bg.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(label||"")}"><div class="grab"></div>${html}</div>`;bg.addEventListener("click",e=>{if(e.target===bg)closeSheet()});document.body.appendChild(bg);bg.querySelector("button,input")?.focus({preventScroll:true})}

function calcVariants(){
  const pan0=pantryAmounts(),me=ME(),eatsAny=s=>S.members.some(m=>m.eats[s]);
  // A — только из имеющегося
  let pan={...pan0};const use={b:{},l:{},s:{},d:{}},A=[],sA=[];
  for(let d=0;d<7;d++){const row={},src={};for(const[s]of SLOTS){
    const cur=S.plan[d][s];
    if(!eatsAny(s)){row[s]=cur;src[s]="skip";continue}
    const cands=POOL[s].map((_,i)=>i).sort((a,b)=>((use[s][a]||0)-(use[s][b]||0))||((b===cur)-(a===cur))||a-b);
    let pick=null;for(const i of cands){const need=slotNeed({...S.plan[d],...row,[s]:i},s);if(fits(need,pan)){pick=i;take(need,pan);break}}
    row[s]=pick;src[s]=pick==null?"none":"own";if(pick!=null)use[s][pick]=(use[s][pick]||0)+1;
  }A.push(row);sA.push(src)}
  // B — докупить минимум
  const panB={...pan},B=A.map(x=>({...x})),sB=sA.map(x=>({...x})),buyB={};
  for(let d=0;d<7;d++)for(const[s]of SLOTS){if(B[d][s]!=null)continue;
    let best=null,bc=Infinity;POOL[s].forEach((_,i)=>{const need=slotNeed({...S.plan[d],...B[d],[s]:i},s);const{miss}=take(need,{...panB});const c=Object.entries(miss).reduce((a,[k,g])=>a+rawCost(k,g),0)+(use[s][i]||0)*150;if(c<bc){bc=c;best=i}});
    const{miss}=take(slotNeed({...S.plan[d],...B[d],[s]:best},s),panB);for(const k in miss)buyB[k]=(buyB[k]||0)+miss[k];
    B[d][s]=best;sB[d][s]=Object.keys(miss).filter(k=>!STAPLE.has(k)).length?"buy":"own";use[s][best]=(use[s][best]||0)+1}
  // C — идеальное
  const C=IDEAL.map(x=>({...x})),panC={...pan0},sC=[],buyC={};
  C.forEach((row,d)=>{const src={};for(const[s]of SLOTS){if(!eatsAny(s)){src[s]="skip";continue}const{miss}=take(slotNeed(row,s),panC);for(const k in miss)buyC[k]=(buyC[k]||0)+miss[k];src[s]=Object.keys(miss).filter(k=>!STAPLE.has(k)).length?"buy":"own"}sC.push(src)});
  const stat=(plan,src,buy,lab,desc)=>{
    let tot=0,own=0;src.forEach(x=>{for(const s in x){if(x[s]==="skip")continue;tot++;if(x[s]==="own")own++}});
    let k=0,p=0;plan.forEach(row=>{const rr={...row};for(const[s]of SLOTS){if(rr[s]==null)continue;const pr=portion(me,rr,s);if(pr){const x=mac(pr);k+=x.k;p+=x.p}}});
    return{plan,src,buy,lab,desc,tot,own,filled:src.reduce((a,x)=>a+Object.values(x).filter(v=>v==="own"||v==="buy").length,0),k:k/7,p:p/7,cost:sumCost(buy,S.store)};
  };
  const sum0=Object.values(pan0).reduce((a,b)=>a+b,0),left=Object.values(pan).reduce((a,b)=>a+b,0);
  return{used:sum0?(sum0-left)/sum0:0,list:[
    stat(A,sA,{},"Из того, что есть","Только ваши продукты, без покупок. Пустые клетки — на них не хватает продуктов."),
    stat(B,sB,buyB,"Докупить немного","Максимум из запасов, на пустые приёмы — самые дешёвые блюда для докупки."),
    stat(C,sC,buyC,"Идеальное меню","Сбалансированная неделя по нормам семьи. Запасы учтены, остальное — в список покупок.")]};
}

let PL=null,PLT=null;
function startWorkout(){

  pg.list.forEach((e,ei)=>{for(let k=1;k<=e[1];k++){steps.push({ei,set:k});const last=ei===pg.list.length-1&&k===e[1];if(e[4]&&!last)steps.push({rest:e[4],next:k<e[1]?ei:ei+1})}});
  PL={lvl:S.program.level,steps,i:0,left:0,run:false,t0:Date.now(),done:false};setLeft();closeSheet();
  const el=document.createElement("div");el.className="player";el.id="player";el.setAttribute("role","dialog");el.setAttribute("aria-label","Тренировка");document.body.appendChild(el);
  clearInterval(PLT);PLT=setInterval(()=>{if(!PL||!PL.run||PL.done)return;PL.left--;if(PL.left<=0)plNext();else renderPlayer()},1000);
  renderPlayer();
}

function weightChart(mid){
  const w=S.weigh[mid]||[];if(w.length<2)return`<div class="small muted">График появится после второго взвешивания.</div>`;
  const W=320,H=130,pad=26,xs=w.map((_,i)=>pad+i*(W-pad*2)/(w.length-1)),mn=Math.min(...w.map(x=>x.w))-1,mx=Math.max(...w.map(x=>x.w))+1,y=v=>H-20-(v-mn)/(mx-mn)*(H-40);
  return`<div class="tbl"><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:520px" role="img" aria-label="График веса"><line x1="${pad}" x2="${W-pad}" y1="${H-20}" y2="${H-20}" style="stroke:var(--line)"/><polyline points="${w.map((x,i)=>xs[i]+","+y(x.w)).join(" ")}" style="fill:none;stroke:var(--accent)" stroke-width="3" stroke-linejoin="round"/>${w.map((x,i)=>`<circle cx="${xs[i]}" cy="${y(x.w)}" r="${i===w.length-1?5:3.5}" style="fill:${i===w.length-1?"var(--accent)":"var(--surface)"};stroke:var(--accent)" stroke-width="2"/><text x="${xs[i]}" y="${y(x.w)-10}" text-anchor="middle" style="fill:var(--ink);font:600 11px 'Golos Text',sans-serif">${x.w}</text><text x="${xs[i]}" y="${H-5}" text-anchor="middle" style="fill:var(--muted);font:10px 'Golos Text',sans-serif">${dShort(x.d)}</text>`).join("")}</svg></div>`;
}

  unbought:()=>{S.bought={};save();render()},
  movebought:()=>{const{miss}=take(weekNeed(S.plan),{...pantryAmounts()});let n=0;for(const k in S.bought){if(!S.bought[k]||!miss[k])continue;const b=buyQty(k,miss[k]),g=P(k)[8]?b.q*P(k)[8]:b.q;const x=S.pantry[k]||{on:false,g:0};S.pantry[k]={on:true,g:(x.on?x.g:0)+g};n++}S.bought={};save();render();toast(n?`Перенесено в кладовую: ${n}`:"Сначала отметьте купленное")},
  copyshop:()=>{const{miss}=take(weekNeed(S.plan),{...pantryAmounts()});const txt="Покупки на неделю ("+STORES[S.store][0]+"):\n"+CATS.map(c=>{const ks=Object.keys(miss).filter(k=>P(k)[5]===c);return ks.length?"\n"+c+":\n"+ks.map(k=>"— "+P(k)[0]+" "+qtyStr(k,miss[k])).join("\n"):""}).join("")+"\n\nИтого ≈ "+fmt(sumCost(miss,S.store))+" ₸";copyText(txt,"Список скопирован")},
  stab:b=>{UI.sportTab=b.dataset.v;render()},
  lvl:b=>{S.program.level=b.dataset.v;save();render()},
  progon:()=>{S.program.on=true;save();render()},
  progoff:()=>{S.program.on=false;save();render()},
  wstart:()=>{S.program.on=true;save();startWorkout()},
  pltoggle:()=>{PL.run=!PL.run;renderPlayer()},
  plnext:()=>plNext(),
  plstop:()=>{PL.done=true;PL.run=false;renderPlayer()},
  plclose:()=>{clearInterval(PLT);PL=null;$("#player")?.remove()},
  plsave:()=>{const m=ME(),min=Math.max(1,(Date.now()-PL.t0)/60000),pg=PROG[PL.lvl];L(TODAY,m.id).wo.push({lvl:PL.lvl,min,kcal:r(pg.met*m.weight*min/60)});save();clearInterval(PLT);PL=null;$("#player")?.remove();UI.date=TODAY;render();toast("Тренировка записана")},
  mnew:()=>openNewMara(),
  mtpl:b=>openNewMara(MTPL[+b.dataset.i]),
  mcreate:()=>{const ids=[...document.querySelectorAll(".mm:checked")].map(x=>x.value);if(!ids.length){toast("Выберите хотя бы одного участника");return}S.marathons.push({id:"mr"+uid(),name:$("#mn").value.trim()||"Марафон",kind:$("#mk").value,target:num($("#mt").value)||1,days:Math.max(3,Math.min(120,num($("#md").value)||14)),start:$("#ms").value||TODAY,members:ids,manual:{}});save();closeSheet();UI.sportTab="mara";render();toast("Марафон запущен")},
  mmark:b=>{const mr=S.marathons.find(x=>x.id===b.dataset.id);mr.manual??={};mr.manual[TODAY]??={};mr.manual[TODAY][b.dataset.m]=!mr.manual[TODAY][b.dataset.m];save();render()},
  mopen:b=>openMara(b.dataset.id),
  mdel:b=>{if(b.dataset.sure){S.marathons=S.marathons.filter(x=>x.id!==b.dataset.id);save();render()}else{b.dataset.sure=1;b.textContent="Точно удалить?";b.classList.add("go")}},
  medit:b=>openMember(b.dataset.id),
  madd:()=>openMember(null),
  msave:b=>{const id=b.dataset.id,isNew=!id,m=isNew?{id:"m"+uid(),weight:70}:M(id);const name=$("#fn").value.trim()||(m.example?m.name:"");if(!name){toast("Введите имя");$("#fn").focus();return}
    const w=num($("#fw").value)||m.weight;Object.assign(m,{name,sex:$("#fs").value,age:num($("#fa").value)||30,height:num($("#fh").value)||165,goal:$("#fg").value,def:+$("#fd").value,act:+$("#fac").value,stepsGoal:num($("#fst").value)||8000,color:+(document.querySelector("input[name=fc]:checked")?.value||0),eats:Object.fromEntries(SLOTS.map(([s])=>[s,document.querySelector(`.fe[value="${s}"]`).checked?1:0]))});
    if(name!=="Пример")delete m.example;
    if(isNew||w!==m.weight){m.weight=w;S.weigh[m.id]??=[];const a=S.weigh[m.id];if(a.length&&a[a.length-1].d===TODAY)a[a.length-1].w=w;else a.push({d:TODAY,w})}
    if(isNew){S.members.push(m);S.marathons.forEach(mr=>{if(!mDone(mr))mr.members.push(m.id)})}
    save();closeSheet();render();toast(isNew?"Участник добавлен — порции пересчитаны":"Сохранено — порции пересчитаны")},
  mremove:b=>{if(!b.dataset.sure){b.dataset.sure=1;b.textContent="Точно удалить?";b.classList.add("go");return}const id=b.dataset.id;S.members=S.members.filter(m=>m.id!==id);S.marathons.forEach(mr=>mr.members=mr.members.filter(x=>x!==id));if(S.active===id)S.active=S.members[0].id;save();closeSheet();render()},
  checkin:()=>openCheckin(),
  cisave:b=>{const msgs=[];for(const id of b.dataset.ids.split(",")){const m=M(id),w=num($("#ci_w_"+id).value);if(!w){toast("Введите вес: "+m.name);return}const before=target(m).kcal;const e={d:TODAY,w};for(const f of["waist","belly","hips"]){const v=num($(`#ci_${f}_${id}`).value);if(v)e[f]=v}S.weigh[id]??=[];const a=S.weigh[id];if(a.length&&a[a.length-1].d===TODAY)Object.assign(a[a.length-1],e);else a.push(e);m.weight=w;const after=target(m).kcal;msgs.push(`${m.name}: ${fmt(before)}→${fmt(after)} ккал`)}S.snooze=null;save();closeSheet();render();toast("Норма обновлена. "+msgs.join(" · "))},
  snooze:()=>{S.snooze=TODAY;save();closeSheet()},
  backup:()=>copyText(JSON.stringify(S),"Данные скопированы — вставьте их на другом устройстве"),
  restore:()=>openSheet(`<h3>Вставить данные</h3><div class="small muted">Вставьте текст, скопированный кнопкой «Скопировать данные». Текущие данные на этом устройстве будут заменены.</div><textarea id="rt" aria-label="Данные"></textarea><button class="btn go" data-act="restoreok">Заменить данные</button><button class="btn ghost" data-act="closesheet">Отмена</button>`,"Импорт"),
  restoreok:()=>{try{const o=JSON.parse($("#rt").value);if(!o.members||!o.plan)throw 0;S=o;save();closeSheet();render();toast("Данные восстановлены")}catch(e){toast("Не получилось прочитать данные — проверьте, что скопирован весь текст")}},
  resetall:b=>{if(!b.dataset.sure){b.dataset.sure=1;b.textContent="Точно сбросить всё?";b.classList.add("go");return}S=defaults();save();render();toast("Данные сброшены")},
  closesheet:()=>closeSheet()
};
// Значение сохраняется на каждый ввод символа (iPhone не шлёт change, если закрыть приложение, не убрав клавиатуру).
// Полная перерисовка — только после выхода из поля.
const CH={
  steps:i=>{L().steps=Math.max(0,r(num(i.value)||0))},
  extra:i=>{L().extra=Math.max(0,r(num(i.value)||0))},
  pg:i=>{const k=i.dataset.k,v=num(i.value)||0,pc=P(k)[8];S.pantry[k]={on:v>0,g:pc?v*pc:v};UI.calc=null},
  price:i=>{const v=num(i.value);if(v==null)delete S.prices[i.dataset.k];else S.prices[i.dataset.k]=v},
  smul:i=>{S.storeMul[i.dataset.st]=num(i.value)||0}
};
function copyText(t,ok){
  const fb=()=>openSheet(`<h3>Скопируйте вручную</h3><textarea readonly style="min-height:200px">${esc(t)}</textarea><button class="btn ghost" data-act="closesheet">Закрыть</button>`,"Текст");
  try{navigator.clipboard.writeText(t).then(()=>toast(ok),fb)}catch(e){fb()}
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const f=ACT[b.dataset.act];if(f){if(b.tagName==="A"&&b.getAttribute("href")==="#")e.preventDefault();f(b,e)}});
document.addEventListener("keydown",e=>{if((e.key===" "||e.key==="Enter")&&e.target.matches('[role="checkbox"][data-act]')){e.preventDefault();e.target.click()}if(e.key==="Escape")closeSheet()});
// После выхода из поля перерисовываем экран, но возвращаем фокус в поле, куда пользователь уже перешёл
const fieldSel=a=>a.id?"#"+CSS.escape(a.id):a.dataset.ch?`[data-ch="${a.dataset.ch}"]`+(a.dataset.k?`[data-k="${a.dataset.k}"]`:"")+(a.dataset.st?`[data-st="${a.dataset.st}"]`:""):null;
let rT;document.addEventListener("change",e=>{const i=e.target.closest("[data-ch]");if(!i||!CH[i.dataset.ch])return;CH[i.dataset.ch](i);save();
  clearTimeout(rT);rT=setTimeout(()=>{const a=document.activeElement,inField=a&&a.matches?.("input,select,textarea")&&!a.closest("#sheet"),sel=inField?fieldSel(a):null,y=scrollY;
    if(a&&a.closest?.("#sheet")){renderDaybar();return}
    render();scrollTo(0,y);if(sel){const n=document.querySelector(sel);if(n){n.focus({preventScroll:true});try{const l=n.value.length;n.setSelectionRange?.(l,l)}catch(_){}}}},0)});
let addT;document.addEventListener("input",e=>{
  if(e.target.id==="addq"){clearTimeout(addT);const q=e.target.value;addT=setTimeout(()=>openAdd(q),250);return}
  const i=e.target.closest("[data-ch]");if(i&&CH[i.dataset.ch]){CH[i.dataset.ch](i);save();renderDaybar()}
});
// Подстраховка: сохраняем при сворачивании и закрытии
const flush=()=>{const a=document.activeElement;if(a&&a.matches?.("[data-ch]")&&CH[a.dataset.ch])CH[a.dataset.ch](a);save()};
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")flush()});
addEventListener("pagehide",flush);
// Просим браузер не удалять данные (Safari, Chrome)
try{navigator.storage?.persist?.()}catch(e){}
const STORAGE_OK=(()=>{try{localStorage.setItem("__t","1");localStorage.removeItem("__t");return true}catch(e){return false}})();

// ===== Старт
render();
(function splash(){
  const sp=$("#splash"),reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const hide=()=>{if(sp.classList.contains("out"))return;sp.classList.add("out");setTimeout(()=>{sp.remove();if(dueMembers().length&&S.snooze!==TODAY)openCheckin()},460)};
  sp.addEventListener("click",hide);setTimeout(hide,reduce?250:1500);
})();
</script>
